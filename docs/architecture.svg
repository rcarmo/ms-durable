<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">Chat — MS Durable architecture</title>
<desc id="desc">The browser uses HTTPS requests and server-sent events to talk to a FastAPI host. The host owns the queue and event projection. A native Copilot process, reached over stdio through the Python SDK, owns the agent loop, tools and compaction. Host state and native session files share SQLite, while workspace files remain on disk. Copilot connects to GitHub Copilot or configured Azure Foundry and to optional MCP servers.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#526479"/></marker></defs>
<style>
text{font-family:'Segoe UI',system-ui,sans-serif;fill:#242424}.heading{font-size:30px;font-weight:600}.name{font-size:19px;font-weight:600}.body{font-size:15px;fill:#454545}.small{font-size:13px;fill:#515151}.tag{font-size:13px;font-weight:600;letter-spacing:1px;fill:#4a4a4a}.card{fill:white;stroke:#bdbdbd}.link{stroke:#526479;stroke-width:1.55;fill:none;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}.optional{stroke-dasharray:5 4}.edge{font-size:13px;fill:#3e526a}
</style>
<rect width="1200" height="740" fill="#fff"/>
<text x="36" y="50" class="heading">Chat · MS Durable architecture</text>
<text x="36" y="78" class="body">Single-user web app · one server process and its native Copilot child</text>
<rect x="55" y="106" width="346" height="78" rx="8" class="card"/>
<text x="76" y="137" class="name">Web browser</text><text x="76" y="161" class="body">Conversations, models and approvals</text>
<rect x="36" y="246" width="788" height="414" rx="10" fill="#f5f5f5" stroke="#c5c5c5"/>
<text x="790" y="273" text-anchor="end" class="tag">APPLICATION HOST</text>
<rect x="55" y="292" width="346" height="144" rx="8" class="card"/>
<text x="76" y="324" class="name">FastAPI + asyncio host</text>
<text x="76" y="351" class="body"><tspan x="76">Serves the UI; authenticates API requests</tspan><tspan x="76" dy="22">Owns session catalogue, queue and approvals</tspan><tspan x="76" dy="22">Projects native events for browser replay</tspan></text>
<rect x="524" y="292" width="280" height="144" rx="8" class="card"/>
<text x="545" y="324" class="name">Native Copilot runtime</text>
<text x="545" y="351" class="body"><tspan x="545">Runs the agent loop and coding tools</tspan><tspan x="545" dy="22">Loads configured skills and MCP</tspan><tspan x="545" dy="22">Owns history and compaction</tspan></text>
<rect x="55" y="542" width="346" height="94" rx="8" class="card"/>
<text x="76" y="572" class="name">SQLite · app.sqlite</text>
<text x="76" y="596" class="body"><tspan x="76">App: sessions, turns, events and approvals</tspan><tspan x="76" dy="20">Copilot: files under /session-state</tspan></text>
<rect x="524" y="542" width="280" height="94" rx="8" class="card"/>
<text x="545" y="572" class="name">Local files</text>
<text x="545" y="596" class="body"><tspan x="545">Preview workspace; configured</tspan><tspan x="545" dy="20">skill directories, if any</tspan></text>
<rect x="902" y="267" width="265" height="104" rx="8" class="card"/>
<text x="923" y="298" class="name">Model provider</text><text x="923" y="324" class="body"><tspan x="923">GitHub Copilot or configured</tspan><tspan x="923" dy="21">Azure Foundry (BYOK)</tspan></text>
<rect x="902" y="403" width="265" height="99" rx="8" class="card"/>
<text x="923" y="434" class="name">MCP servers · optional</text><text x="923" y="460" class="body"><tspan x="923">Native HTTP or stdio integration</tspan><tspan x="923" dy="21">e.g. Memento, when configured</tspan></text>
<path d="M152 184V292" class="link"/>
<text x="162" y="210" class="edge">HTTPS · REST + bearer token</text>
<path d="M352 292V184" class="link"/>
<text x="363" y="233" class="edge">SSE · replay + live events</text>
<path d="M401 359H524" class="link both"/>
<text x="462" y="331" text-anchor="middle" class="edge">Python SDK</text><text x="462" y="347" text-anchor="middle" class="edge">stdio RPC</text>
<path d="M143 436V542" class="link both"/><text x="155" y="473" class="edge">App state</text>
<path d="M633 436V501H285V542" class="link both"/><text x="423" y="489" class="edge">SessionFS adapter (host)</text>
<path d="M723 436V542" class="link both"/><text x="733" y="473" class="edge">Disk I/O</text>
<path d="M804 319H902" class="link"/><text x="853" y="309" text-anchor="middle" class="edge">Inference</text>
<path d="M804 408H856V452H902" class="link optional"/>
<text x="36" y="695" class="small">Recovery: queued turns resume; in-flight turns are marked interrupted and are not resent automatically.</text>
<text x="36" y="717" class="small">Native shell tools run as the service user. The workspace path and approval prompts do not provide a sandbox.</text>
</svg>
