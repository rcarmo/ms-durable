[project]
name = "ms-durable"
version = "0.2.4"
license = {file = "LICENSE"}
description = "A small asyncio/FastAPI UI for the Microsoft Copilot harness"
requires-python = ">=3.11"
dependencies = ["microsoft-copilot-sdk==2.0.1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "aiosqlite>=0.20,<1", "pillow==13.0.0"]

[project.optional-dependencies]
azure = ["azure-identity>=1.19,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["agent*"]
